<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor - KanbanFlow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/darkly/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Minimal layout adjustments using template logic */
        .monitor-container { padding: 40px 20px; }
        .status-card { border-radius: 8px; border: 1px solid #444; }
        .flyout-menu { z-index: 1050; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/index.html">KanbanFlow</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarColor01">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="/project/list.html">Projects</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/project/kanban.html">Kanban</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/system/monitor.html">Monitor</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container monitor-container">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h1 class="display-6 fw-bold text-uppercase" style="letter-spacing: 2px;">System Monitor</h1>
            <div style="height: 2px; background: #375a7f; width: 100px; margin: 10px auto;"></div>
        </div>
    </div>

    <main class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div id="standardAPI" class="card status-card shadow-sm">
                <div class="card-header bg-dark d-flex justify-content-between align-items-center border-bottom border-secondary">
                    <span class="fw-bold"><i class="fas fa-server me-2 text-primary"></i>Kanban Flow API</span>
                    <span class="badge bg-secondary">System Node</span>
                </div>
                <div class="card-body py-4">
                    <h5 class="card-title text-white">Upstream API Status</h5>
                    <p class="text-muted small mb-4">Real-time health check for Kanban Flow operations and data synchronization.</p>

                    <div class="p-3 rounded bg-dark border border-secondary text-center">
                        <h2 id="upstreamAPI" class="display-4 fw-bold mb-1">--</h2>
                        <p id="standardAPIText" class="text-info mb-0">Loading API Node status...</p>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-top border-secondary text-center">
                    <button class="btn btn-sm btn-outline-primary" onclick="window.location.reload();">
                        <i class="fas fa-sync-alt me-1"></i> Refresh Status
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer class="mt-5 pt-4 text-muted border-top text-center small">
        <p>Made with <i class="fas fa-heart text-danger"></i> by <a href="https://softwareshinobi.com" target="_blank" class="text-decoration-none text-primary">Software Shinobi</a></p>
    </footer>
</div>

<div class="position-fixed bottom-0 end-0 p-3 flyout-menu">
    <div class="card border-primary shadow-lg" style="width: 18rem; background-color: #2a2a2a;">
        <div class="card-body">
            <h6 class="text-uppercase small fw-bold text-primary mb-3">Current Project</h6>
            <div id="projectBannerArea" class="mb-4">
                <button id="projectBanner" disabled class="btn btn-success w-100 fw-bold">--</button>
            </div>

            <h6 class="text-uppercase small fw-bold text-muted mb-2">Switch Project</h6>
            <div id="projectSwitcherArea" class="list-group list-group-flush rounded border border-secondary">
                </div>
        </div>
    </div>
</div>

<!-- html / scripting / begin -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/toastr.min.js"></script>





<script src="/project/scripting/flyout.js"></script>

<script src="/assets/js/scrum/project.js"></script>

<script src="/assets/js/api/server.js"></script>

<!-- html / scripting / end -->
 
<script src="js/monitor.js"></script>

</body>
</html>
