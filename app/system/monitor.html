<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>System Monitor / Kanban Flow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/sketchy/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { padding-top: 2rem; padding-bottom: 2rem; }
        .card-box { margin-bottom: 2rem; border-width: 2px; }
        .navbar { margin-bottom: 2rem; border-width: 2px; }
    </style>
</head>

<body>

    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="/index.html">Workspace</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="/project/list.html">Projects</a>
                    <a class="nav-link" href="/project/kanban.html">Kanban</a>
                    <a class="nav-link active" href="/system/monitor.html">Monitor</a>
                </div>
            </div>
        </nav>

        <header class="pb-2 mt-4 mb-2 border-bottom">
            <h1>System Monitor</h1>
        </header>

        <main>
            <div class="row">
                <div class="col-md-8 mx-auto">

                    <div id="standardAPI" class="card border-secondary mb-3 card-box">
                        <div class="card-header bg-secondary text-white">Kanban Flow API</div>
                        <div class="card-body">
                            <h5 class="card-title">Upstream API Status</h5>
                            <p class="card-text text-muted">Upstream API for Kanban Flow Operations.</p>

                            <hr />

                            <div class="alert alert-light">
                                <p id="upstreamAPI" class="fw-bold">--</p>
                                <p id="standardAPIText">Loading API Node status...</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <footer class="pt-3 mt-4 text-muted border-top text-center">
            Made with ❤ by <a href="https://softwareshinobi.com" target="_blank" class="text-decoration-none">Software Shinobi</a>
        </footer>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div class="card border-primary" style="width: 18rem;">
            <div class="card-body">
                <h6>Current Project</h6>
                <div id="projectBannerArea">
                    <button id="projectBanner" disabled class="btn btn-sm btn-success w-100">--</button>
                </div>
                <h6 class="mt-3">Switch Project</h6>
                <div id="projectSwitcherArea" class="list-group">
                    </div>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/project.js"></script>
    <script src="/plugins/jquery/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/toastr.min.js"></script>

    <script src="/project/scripting/flyout.js"></script>
    <script src="js/monitor.js"></script>

</body>
</html>
