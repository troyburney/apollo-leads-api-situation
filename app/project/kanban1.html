<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketchy Kanban Board</title>
    <!-- Sketchy Bootswatch Theme -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/sketchy/bootstrap.min.css">
    <!-- Bootstrap JS for Dropdowns and Toggler -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #fdfdfd;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Center the board container */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .kanban-container {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            padding: 10px;
            max-width: 100%;
            justify-content: center; /* Centers columns if there's space */
        }

        .kanban-column {
            flex: 0 0 300px;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 15px;
            min-height: 70vh;
            padding: 15px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .column-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed #333;
            padding-bottom: 10px;
        }

        .task-list {
            flex-grow: 1;
            min-height: 150px;
        }

        .task-card {
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            cursor: grab;
            transition: transform 0.1s ease;
            position: relative;
            font-family: inherit;
        }

        .task-card:hover {
            transform: scale(1.02) rotate(-0.5deg);
            background-color: #fff9e6;
        }

        .task-card:active {
            cursor: grabbing;
        }

        .dragging {
            opacity: 0.4;
            border-style: dashed;
        }

        .delete-btn {
            position: absolute;
            top: 5px;
            right: 8px;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            cursor: pointer;
            color: #d9534f;
            padding: 0;
        }

        /* Responsive adjustments */
        @media (max-width: 1200px) {
            .kanban-container {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- Requested Navbar -->
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">SketchyBoard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home
                            <span class="visually-hidden">(current)</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false">Dropdown</a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="#">Action</a>
                            <a class="dropdown-item" href="#">Another action</a>
                            <a class="dropdown-item" href="#">Something else here</a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#">Separated link</a>
                        </div>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-sm-2" type="search" placeholder="Search">
                    <button class="btn btn-secondary my-2 my-sm-0" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <!-- Kanban Board Container -->
        <div class="kanban-container">
            <!-- To Do -->
            <div class="kanban-column" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h3>To Do</h3>
                </div>
                <div class="task-list">
                    <div class="task-card" draggable="true" ondragstart="drag(event)" id="task-1">
                        <button class="delete-btn" onclick="deleteTask('task-1')">✖</button>
                        Draft project proposal
                    </div>
                    <div class="task-card" draggable="true" ondragstart="drag(event)" id="task-2">
                        <button class="delete-btn" onclick="deleteTask('task-2')">✖</button>
                        Fix alignment issues
                    </div>
                </div>
                <button class="btn btn-sm btn-outline-dark mt-2" onclick="promptNewTask('todo')">+ Add Task</button>
            </div>

            <!-- In Progress -->
            <div class="kanban-column" id="inprogress" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h3>In Progress</h3>
                </div>
                <div class="task-list">
                    <div class="task-card" draggable="true" ondragstart="drag(event)" id="task-3">
                        <button class="delete-btn" onclick="deleteTask('task-3')">✖</button>
                        Styling the navbar
                    </div>
                </div>
                <button class="btn btn-sm btn-outline-dark mt-2" onclick="promptNewTask('inprogress')">+ Add Task</button>
            </div>

            <!-- Testing -->
            <div class="kanban-column" id="testing" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h3>Testing</h3>
                </div>
                <div class="task-list">
                </div>
                <button class="btn btn-sm btn-outline-dark mt-2" onclick="promptNewTask('testing')">+ Add Task</button>
            </div>

            <!-- Done -->
            <div class="kanban-column" id="done" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h3>Done</h3>
                </div>
                <div class="task-list">
                    <div class="task-card" draggable="true" ondragstart="drag(event)" id="task-4">
                        <button class="delete-btn" onclick="deleteTask('task-4')">✖</button>
                        Choose Sketchy theme
                    </div>
                </div>
                <button class="btn btn-sm btn-outline-dark mt-2" onclick="promptNewTask('done')">+ Add Task</button>
            </div>
        </div>
    </main>

    <script>
        // Drag and Drop Logic
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
            ev.target.classList.add('dragging');
        }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            if (!draggedElement) return;

            draggedElement.classList.remove('dragging');

            let target = ev.target;
            while (target && !target.classList.contains('kanban-column')) {
                target = target.parentElement;
            }

            if (target) {
                target.querySelector('.task-list').appendChild(draggedElement);
            }
        }

        // Add Task Logic via button
        function promptNewTask(columnId) {
            const taskContent = window.prompt("Enter task description:");
            if (taskContent && taskContent.trim() !== "") {
                const taskId = 'task-' + Date.now();
                const taskCard = document.createElement('div');
                taskCard.className = 'task-card';
                taskCard.draggable = true;
                taskCard.id = taskId;
                taskCard.ondragstart = drag;

                taskCard.innerHTML = `
                    <button class="delete-btn" onclick="deleteTask('${taskId}')">✖</button>
                    ${taskContent.trim()}
                `;

                document.getElementById(columnId).querySelector('.task-list').appendChild(taskCard);
            }
        }

        // Delete Task Logic
        function deleteTask(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        document.addEventListener("dragend", function(event) {
            if (event.target.classList) {
                event.target.classList.remove('dragging');
            }
        });
    </script>
</body>
</html>
