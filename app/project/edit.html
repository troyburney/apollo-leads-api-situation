<div class="container edit-container">
    <header class="mb-5">
        <h1 class="text-uppercase fw-bold" style="letter-spacing: 1px;">Edit Project</h1>
        <p class="text-muted">Modify project details, client information, and core intentions.</p>
    </header>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="form-card p-4 h-100">
                <h5 class="section-header"><i class="fas fa-info-circle me-2 text-info"></i>General</h5>
                
                <div class="mb-3">
                    <label class="form-label text-white small fw-bold">Project ID</label>
                    <input type="text" id="id" class="form-control bg-dark border-secondary text-white" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white small fw-bold">Project Name</label>
                    <input type="text" id="name" class="form-control bg-dark border-secondary text-white">
                </div>

                <div class="mb-3">
                    <label class="form-label text-white small fw-bold">Client</label>
                    <input type="text" id="client" class="form-control bg-dark border-secondary text-white">
                </div>

                <div class="mb-0">
                    <label class="form-label text-white small fw-bold">Project Description</label>
                    <textarea id="description" class="form-control bg-dark border-secondary text-white" rows="5"></textarea>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="form-card p-4 h-100">
                <h5 class="section-header"><i class="fas fa-bullseye me-2 text-warning"></i>Intention</h5>
                <div class="mb-0">
                    <label class="form-label text-white small fw-bold">The "Why" Behind This Project</label>
                    <textarea id="intention" class="form-control bg-dark border-secondary text-white" rows="12"></textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4 g-2">
        <div class="col-md-2">
            <button type="button" class="btn btn-outline-warning w-100 p-3" onclick="clearForm()">
                <i class="fas fa-undo me-2"></i>Reset
            </button>
        </div>
        <div class="col-md-8">
            <button type="button" class="btn btn-success w-100 p-3 fw-bold text-uppercase" onclick="pushEditedProject()" style="letter-spacing: 1px;">
                <i class="fas fa-save me-2"></i>Save Changes
            </button>
        </div>
        <div class="col-md-2">
            <button id="deleteProjectButton" type="button" class="btn btn-outline-danger w-100 p-3" onclick="deleteProject()">
                <i class="fas fa-trash-alt me-2"></i>Delete
            </button>
        </div>
    </div>

    <footer class="mt-5 pt-4 text-muted border-top text-center small">
        <p>Made with ❤ by <a href="https://softwareshinobi.com" target="_blank" class="text-decoration-none text-primary">Software Shinobi</a></p>
