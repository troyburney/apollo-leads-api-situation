<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Calendar / KanbanFlow</title>
    <link rel="shortcut icon" href="/favicon.ico" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/darkly/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">

    <style>
        body {
            background-color: #1a1a1a;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .card {
            background-color: #2a2a2a;
            border: 1px solid #444;
        }

        /* FullCalendar Dark Overrides */
        .fc {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }
        .fc-theme-standard td, .fc-theme-standard th {
            border: 1px solid #444 !important;
        }
        .fc-list-day-cushion {
            background-color: #303030;
        }
        .fc-col-header-cell {
            background-color: #375a7f;
            color: white;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .fc-daygrid-day:hover {
            background-color: #333;
        }

        #external-events .fc-event {
            cursor: move;
            margin: 5px 0;
            padding: 8px;
        }
    </style>
</head>
<body>

  <div class="container-fluid">
    <a class="navbar-brand" href="/index.html">KanbanFlow</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/intention/intention.html">Intention</a></li>
        <li class="nav-item"><a class="nav-link active" href="/calendar/calendar.html">Calendar</a></li>
        <li class="nav-item"><a class="nav-link" href="/project/list.html">All Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="/project/kanban.html">Kanban Board</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button">Work Space</a>
          <div class="dropdown-menu">
            <a class="dropdown-item" href="/story/inprogress.html">In Progress</a>
            <a class="dropdown-item" href="/story/completed.html">Score Board</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="/project/create.html">Create Project</a>
            <a class="dropdown-item" href="/story/create.html">Create Story</a>
          </div>
        </li>
      </ul>
      <button class="btn btn-outline-info" data-bs-toggle="offcanvas" data-bs-target="#sidebarRight">
        <i class="fas fa-th-large"></i> Project Switcher
      </button>
    </div>
  </div>
</nav>

<div class="container-fluid py-4">
    <div class="row">
        <div class="col-md-3">
            <div class="card mb-3">
                <div class="card-header bg-dark">
                    <h5 class="mb-0 text-info">Create Event</h5>
                </div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <input id="new-event" type="text" class="form-control" placeholder="Event Title">
                        <button id="add-new-event" class="btn btn-primary" type="button">Add</button>
                    </div>
                    <div id="external-events">
                        <p class="small text-muted text-uppercase fw-bold">Draggable Events</p>
                        </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-dark">
                    <h5 class="mb-0 text-success">Actions</h5>
                </div>
                <div class="card-body d-grid gap-2">
                    <button id="save-calendar-changes" onclick="saveCalendarChanges()" type="button" class="btn btn-success">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-9">
            <div class="card">
                <div class="card-body p-2">
                    <div id="calendar"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-end bg-dark text-light" tabindex="-1" id="sidebarRight">
  <div class="offcanvas-header border-bottom border-secondary">
    <h5 class="offcanvas-title">Current Project</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <div id="projectBannerArea" class="mb-4 text-center">
        <button id="projectBanner" disabled type="button" class="btn btn-lg btn-success w-100">--</button>
    </div>
    <hr class="border-secondary">
    <h5>Select Project</h5>
    <div id="projectSwitcherArea" class="d-grid gap-2">
        </div>
  </div>
</div>

<script src="/plugins/jquery/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>

<script src="/js/config.js"></script>

<script src="/js/project.js"></script>

<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

<script src="fullcalendar.js"></script>

<script src="calendarsync.js"></script>>

<script>
$(".add-task-btn").on("click", function() {
    const taskTitle = prompt("Enter Task Titl3e:"); // Simple prompt for sync
    if (!taskTitle) return;

    const targetList = $(this).siblings(".kanban-items");
    const newCard = `
        <div class="kanban-card">
            <h6>${taskTitle}</h6>
            <p class="text-muted small mb-0">Syncing to calendar...</p>
            <span class="card-tag bg-secondary">New</span>
        </div>
    `;
    targetList.append(newCard);
    updateCounts();

    // OPTIONAL: Automatically add to calendar if valorantCalendar is present
    if (typeof valorantCalendar !== 'undefined') {
        valorantCalendar.addEvent({
            title: taskTitle,
            start: new Date().toISOString(),
            allDay: true
        });
        saveCalendarChanges(); // Push to backend
    }
});</script>
</body>
</html>
