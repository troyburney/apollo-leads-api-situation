server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial line to make Nginx handle 404s properly when a file isn't found
        try_files $uri $uri/ =404;
    }

    # --- CUSTOM 404 SETUP ---
    # 1. Enable the 404 error page
    error_page 404 /404.html;

    # 2. Block direct access to the 404 page URI and serve it internally
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
    # ------------------------

    # The existing 50x error page handling:
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # (Keep commented-out PHP/other blocks from the original file if desired)
}
