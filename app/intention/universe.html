<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Universe / KanbanFlow</title>
    <link rel="shortcut icon" href="/favicon.ico" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/darkly/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            background-color: #1a1a1a;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Large Hero Intention Style */
        .intention-display-container {
            height: calc(100vh - 160px); /* Adjust for nav and footer */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #intention {
            font-size: 6rem;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            color: #375a7f;
            letter-spacing: -3px;
            line-height: 1;
        }

        #intention:hover {
            color: #00bc8c;
            transform: scale(1.02);
        }

        /* Standardized Modal Styles */
        .modal-content {
            background-color: #2a2a2a;
            border: 1px solid #444;
        }
        .modal-header {
            border-bottom: 1px solid #444;
            background-color: #303030;
        }
    </style>
</head>
<body>

<!-- html / menu / begin -->

<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/index.html">K333anbanFlow</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/intention/intention.html">Intention</a></li>
        <li class="nav-item"><a class="nav-link" href="/calendar/calendar.html">Calendar</a></li>
        <li class="nav-item"><a class="nav-link" href="/project/list.html">All Projects</a></li>
        <li class="nav-item"><a class="nav-link active" href="/project/kanban.html">Kanban Board</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button">Work Space</a>
          <div class="dropdown-menu">
            <a class="dropdown-item" href="/story/inprogress.html">In Progress</a>
            <a class="dropdown-item" href="/story/completed.html">Score Board</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="/project/create.html">Create Project</a>
            <a class="dropdown-item" href="/story/create.html">Create Story</a>
          </div>
        </li>
      </ul>
      <button class="btn btn-outline-info" data-bs-toggle="offcanvas" data-bs-target="#sidebarRight">
        <i class="fas fa-th-large"></i> Project Switcher
      </button>
    </div>
  </div>
</nav>

<!-- html / menu / end -->

<div class="container-fluid">
    <div class="intention-display-container">
        <div id="intention"
             data-bs-toggle="modal"
             data-bs-target="#setIntentionModal">
            --
        </div>
    </div>
</div>

<div class="modal fade" id="setIntentionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">
            <div class="modal-header">
                <h5 class="modal-title text-info uppercase fw-bold">
                    <i class="fas fa-crosshairs me-2"></i>Update Universe Intention
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
                <div class="mb-4">
                    <label class="form-label text-muted small text-uppercase fw-bold">Current Focus</label>
                    <input type="text" id="currentIntention" class="form-control bg-dark border-secondary text-white" value="--" disabled>
                </div>

                <div class="mb-2">
                    <label for="newIntention" class="form-label text-success small text-uppercase fw-bold">New Focus</label>
                    <input type="text" id="newIntention" class="form-control border-success text-white" placeholder="What are we doing?" style="background-color: #1a1a1a;">
                </div>
            </div>

            <div class="modal-footer border-top-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success px-4" data-bs-dismiss="modal" onclick="setIntention()">
                    Set Intention
                </button>
            </div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-end bg-dark text-light" tabindex="-1" id="sidebarRight">
  <div class="offcanvas-header border-bottom border-secondary">
    <h5 class="offcanvas-title">Current Project</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <div id="projectBannerArea" class="mb-4 text-center">
        <button id="projectBanner" disabled type="button" class="btn btn-lg btn-success w-100">--</button>
    </div>
    <hr class="border-secondary">
    <h5>Select Project</h5>
    <div id="projectSwitcherArea" class="d-grid gap-2">
        </div>
  </div>
</div>

<script src="/plugins/jquery/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>

<script src="/js/config.js"></script>
<script src="/js/project.js"></script>
<script src="/project/scripting/flyout.js"></script>
<script src="/intention/scripting/intention.js"></script>

<script>
    $('#setIntentionModal').on('shown.bs.modal', function () {
        $('#newIntention').focus();
    });
</script>

</body>
</html>
