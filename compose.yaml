services:

##########################################
##
## kanban-flow / data management
##
##########################################

    kanban-flow-database:

        container_name: kanban-flow-database

        image: mariadb:latest

        ports:

            - "3306:3306"
      
        restart: unless-stopped

        environment:

            MYSQL_ROOT_PASSWORD: aggiepride
            
            MYSQL_DATABASE: sandbox

            MYSQL_USER: sandbox

            MYSQL_PASSWORD: sandbox

    kanban-flow-phpmyadmin:

        container_name: kanban-flow-phpmyadmin

        image: beeyev/phpmyadmin-lightweight:latest

        restart: unless-stopped

        ports:

            - "3380:80"
      
        depends_on:
        
            - kanban-flow-database

        environment:
    
            PMA_HOST: kanban-flow-database

            PMA_PORT: 3306

            PMA_ARBITRARY: 1

    kanban-flow-apis:
      
        container_name: kanban-flow-apis
        
        image: softwareshinobi/kanban-flow-apis

        build: 

            context: .

            dockerfile: Dockerfile

        restart: unless-stopped

        ports:

            - "8888:8888"
        
        environment:

            DB_HOST: kanban-flow-database
            
            DB_PORT: 3306

            DB_NAME: sandbox

            DB_USER: sandbox

            DB_PASS: sandbox

    kanban-flow-app-adminlte:

        container_name: kanban-flow-app-adminlte

        image: softwareshinobi/kanban-flow-app:intranet

        build: 

            context: app/adminlte

            dockerfile: Dockerfile

        restart: unless-stopped

        ports:

            - "8000:80"

    kanban-flow-app-admincast:

        container_name: kanban-flow-app-admincast

        image: softwareshinobi/kanban-flow-app:admincast

        build: 

            context: app/admincast

            dockerfile: Dockerfile

        restart: unless-stopped

        ports:

            - "8001:80"

    kanban-flow-app-darkpan:

        container_name: kanban-flow-app-darkpan

        image: softwareshinobi/kanban-flow-app:darkpan

        build: 

            context: app/darkpan

            dockerfile: Dockerfile

        restart: unless-stopped

        ports:

            - "8002:80"

    kanban-flow-docs:

        container_name: kanban-flow-docs

        image: softwareshinobi/kanban-flow:docs

        build: 

            context: docs

            dockerfile: Dockerfile

        restart: unless-stopped

        ports:

            - "8880:80"
